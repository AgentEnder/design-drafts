<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Target Defaults Redesign · Docs</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css"
    />
    <style>
      :root {
        --bg: #0e1117;
        --sidebar: #11161f;
        --content: #0e1117;
        --panel: #161b24;
        --line: #232a36;
        --ink: #e6edf3;
        --muted: #9aa7b6;
        --accent: #5eead4;
        --accent-soft: rgba(94, 234, 212, 0.12);
        --link: #6cb6ff;
        --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        line-height: 1.65;
        display: grid;
        grid-template-columns: 290px 1fr;
        min-height: 100vh;
      }

      /* ───────── sidebar ───────── */
      aside {
        background: var(--sidebar);
        border-right: 1px solid var(--line);
        padding: 28px 20px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }
      aside .brand {
        font-weight: 700;
        font-size: 15px;
        letter-spacing: -0.01em;
        margin-bottom: 4px;
      }
      aside .brand-sub {
        font-family: var(--mono);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--muted);
        margin-bottom: 24px;
      }
      nav a {
        display: block;
        padding: 8px 12px;
        margin: 2px 0;
        border-radius: 8px;
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
        transition:
          background 0.15s,
          color 0.15s;
      }
      nav a:hover {
        background: var(--panel);
        color: var(--ink);
      }
      nav a.active {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      nav .nav-label {
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: var(--muted);
        opacity: 0.7;
        margin: 22px 0 6px 12px;
      }
      nav hr {
        border: none;
        border-top: 1px solid var(--line);
        margin: 18px 0;
      }

      /* ───────── content ───────── */
      main {
        padding: 56px clamp(24px, 6vw, 96px);
        max-width: 980px;
      }
      .md h1,
      .md h2,
      .md h3 {
        line-height: 1.25;
        letter-spacing: -0.015em;
      }
      .md h1 {
        font-size: 34px;
        margin: 0 0 24px;
      }
      .md h2 {
        font-size: 23px;
        margin: 40px 0 14px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--line);
      }
      .md h3 {
        font-size: 18px;
        margin: 28px 0 10px;
      }
      .md p,
      .md li {
        color: #cdd6e0;
      }
      .md a {
        color: var(--link);
        text-decoration: none;
      }
      .md a:hover {
        text-decoration: underline;
      }
      .md blockquote {
        margin: 16px 0;
        padding: 4px 18px;
        border-left: 3px solid var(--accent);
        background: var(--accent-soft);
        border-radius: 0 8px 8px 0;
        color: var(--muted);
      }
      .md code {
        font-family: var(--mono);
        font-size: 0.86em;
        background: var(--panel);
        padding: 2px 6px;
        border-radius: 5px;
      }
      .md pre {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px 18px;
        overflow-x: auto;
      }
      .md pre code {
        background: none;
        padding: 0;
        font-size: 13px;
        line-height: 1.6;
      }
      .md table {
        border-collapse: collapse;
        width: 100%;
        margin: 18px 0;
        font-size: 13.5px;
        display: block;
        overflow-x: auto;
      }
      .md th,
      .md td {
        border: 1px solid var(--line);
        padding: 8px 12px;
        text-align: left;
        white-space: nowrap;
      }
      .md th {
        background: var(--panel);
        font-weight: 600;
      }
      .md tr:nth-child(even) td {
        background: rgba(255, 255, 255, 0.015);
      }
      .md ul,
      .md ol {
        padding-left: 22px;
      }
      .md li {
        margin: 5px 0;
      }
      .md hr {
        border: none;
        border-top: 1px solid var(--line);
        margin: 32px 0;
      }
      .error {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 24px;
        color: var(--muted);
      }
      .error code {
        font-family: var(--mono);
        color: var(--accent);
      }

      @media (max-width: 760px) {
        body {
          grid-template-columns: 1fr;
        }
        aside {
          position: static;
          height: auto;
        }
        main {
          padding: 32px 20px;
        }
      }
    </style>
  </head>
  <body>
    <aside>
      <div class="brand">Target Defaults</div>
      <div class="brand-sub">Redesign Docs</div>
      <nav id="nav"></nav>
    </aside>
    <main>
      <div class="md" id="content">Loading…</div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
    <script>
      const DOCS = [
        ["docs/index.md", "Overview", "Start here"],
        ["docs/current.md", "Renamed targets", "Designs"],
        ["docs/array-with-query-key.md", "Array + query key", null],
        ["docs/nested-array.md", "Nested array ⭐", null],
        ["docs/inside-plugin-config.md", "Inside plugin config", null],
        ["demos/with-nx-plugins/README.md", "With nx plugins", "Demos"],
        ["demos/bare-pnpm/README.md", "Bare pnpm", null],
      ];

      const navEl = document.getElementById("nav");
      const contentEl = document.getElementById("content");
      let currentFile = "";

      // build the sidebar
      DOCS.forEach(([file, label, section]) => {
        if (section) {
          const h = document.createElement("div");
          h.className = "nav-label";
          h.textContent = section;
          navEl.appendChild(h);
        }
        const a = document.createElement("a");
        a.href = "#/" + file;
        a.dataset.file = file;
        a.textContent = label;
        navEl.appendChild(a);
      });
      const hr = document.createElement("hr");
      navEl.appendChild(hr);
      const viz = document.createElement("a");
      viz.href = "visualizer.html";
      viz.textContent = "↗ Interactive visualizer";
      navEl.appendChild(viz);

      // resolve a relative href against the markdown file it came from
      function resolvePath(relative, fromFile) {
        const url = new URL(relative, "https://x/" + fromFile);
        return url.pathname.replace(/^\//, "");
      }

      function route() {
        return location.hash.replace(/^#\/?/, "") || "docs/index.md";
      }

      async function render() {
        const file = route();
        currentFile = file;
        navEl.querySelectorAll("a[data-file]").forEach((a) => {
          a.classList.toggle("active", a.dataset.file === file);
        });

        let md;
        try {
          const res = await fetch(file);
          if (!res.ok) throw new Error(res.status);
          md = await res.text();
        } catch (e) {
          contentEl.innerHTML =
            '<div class="error"><h2>Could not load <code>' +
            file +
            "</code></h2><p>This viewer reads the markdown files over HTTP. Open it via a " +
            "local server rather than the <code>file://</code> protocol:</p>" +
            "<pre><code>npm run serve</code></pre><p>then visit the printed URL.</p></div>";
          return;
        }

        contentEl.innerHTML = marked.parse(md);

        // syntax-highlight code blocks (treat jsonc as json)
        contentEl.querySelectorAll("pre code").forEach((block) => {
          block.className = block.className.replace("language-jsonc", "language-json");
          hljs.highlightElement(block);
        });

        // rewrite relative links: .md → in-app nav, others → open raw file
        contentEl.querySelectorAll("a[href]").forEach((a) => {
          const href = a.getAttribute("href");
          if (/^(https?:|mailto:|#)/.test(href)) return;
          const resolved = resolvePath(href, currentFile);
          if (resolved.endsWith(".md")) {
            a.setAttribute("href", "#/" + resolved);
          } else {
            a.setAttribute("href", resolved);
            a.setAttribute("target", "_blank");
            a.setAttribute("rel", "noopener");
          }
        });

        window.scrollTo(0, 0);
      }

      window.addEventListener("hashchange", render);
      render();
    </script>
  </body>
</html>
