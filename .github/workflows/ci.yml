name: CI

# The gate for every pull request and every push to main.
#
# The legs are `build`, `typecheck` and `test`, and each one catches a class the
# others structurally cannot: `test` runs transpiled code and never type-checks a
# line it doesn't execute, so a tree can be fully green and still not compile
# (which is exactly how the TS 6 break in markdown-site reached main).
#
# Every leg here must match at least one project. `lint` used to be listed and
# matched none — there is no eslint config and no project declares the target —
# so Nx quietly ran two legs while the workflow claimed three.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so nx release can read prior tags and derive
          # conventional-commit version bumps.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Build, typecheck and test
        run: pnpm exec nx run-many -t build typecheck test
